<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisionAId — calibration checkerboard</title>
<style>
  html,body { margin:0; height:100%; background:#fff; color:#000; font:16px system-ui,sans-serif; }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; }
  svg { max-width:96vw; max-height:84vh; }
  p { margin:8px 16px; text-align:center; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="board"></svg>
  <p id="info"></p>
</div>
<script>
  // Calibration checkerboard: `cols` × `rows` squares (inner corners: (cols-1) × (rows-1)).
  const q = new URLSearchParams(location.search);
  const cols = parseInt(q.get("cols") || "10", 10), rows = parseInt(q.get("rows") || "7", 10);
  const s = 100, svg = document.getElementById("board");
  svg.setAttribute("viewBox", `0 0 ${(cols + 2) * s} ${(rows + 2) * s}`);
  let html = `<rect width="${(cols + 2) * s}" height="${(rows + 2) * s}" fill="#fff"/>`;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    if ((r + c) % 2 === 0) html += `<rect x="${(c + 1) * s}" y="${(r + 1) * s}" width="${s}" height="${s}" fill="#000"/>`;
  svg.innerHTML = html;
  document.getElementById("info").textContent =
    `Checkerboard ${cols}×${rows} squares (${cols - 1}×${rows - 1} inner corners). ` +
    `Full screen, maximum brightness. Measure the side of one square with a ruler and write it down.`;
</script>
</body>
</html>
