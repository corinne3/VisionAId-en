<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VisionAId — sensor</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --muted:#9a9a9a; --ok:#3ccf6e; --warn:#f0b429; --err:#ff5c5c; --accent:#ff8a1f; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system,system-ui,sans-serif; }
  main { padding:16px; max-width:640px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 8px; }
  button { font:inherit; border:0; border-radius:14px; padding:18px; width:100%; margin:8px 0; color:#111; background:var(--accent); font-weight:600; font-size:20px; }
  button.secondary { background:#2a2a2a; color:var(--fg); font-size:16px; padding:12px; }
  button:disabled { opacity:.4; }
  #status { font-weight:600; margin:8px 0; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; margin:12px 0; }
  .grid div { background:#1c1c1c; border-radius:10px; padding:8px 10px; }
  .grid b { display:block; font-size:22px; }
  .grid span { color:var(--muted); font-size:13px; }
  video { width:100%; max-height:40vh; object-fit:contain; background:#000; border-radius:10px; }
  #level { position:relative; height:44px; background:#1c1c1c; border-radius:10px; margin:8px 0; overflow:hidden; }
  #bubble { position:absolute; top:8px; width:28px; height:28px; border-radius:50%; background:var(--ok); left:calc(50% - 14px); transition:left .1s; }
  #level::after { content:""; position:absolute; left:50%; top:0; bottom:0; border-left:2px dashed #555; }
  #levelText { color:var(--muted); font-size:13px; }
  .row { display:flex; gap:8px; } .row button { flex:1; }
  label { display:flex; gap:8px; align-items:center; margin:8px 0; }
  textarea { width:100%; background:#1c1c1c; color:var(--fg); border:0; border-radius:10px; padding:8px; font:inherit; }
  .sound { background:#1c1c1c; border-radius:10px; padding:10px; margin:8px 0; }
  .sound label { margin:6px 0 0; }
  .sound input[type=range] { width:100%; accent-color:var(--accent); }
  #talk { min-height:28vh; font-size:30px; background:#3c8cff; color:#fff; }
  #talk.listening { background:var(--err); }
  #heard { font-size:18px; margin:4px 0 8px; min-height:1.4em; }
  .typed { display:flex; gap:8px; } .typed input { flex:1; background:#1c1c1c; color:var(--fg); border:0; border-radius:10px; padding:8px; font:inherit; }
  .typed button { width:auto; margin:0; }
  #log { color:var(--muted); font-size:12px; white-space:pre-wrap; max-height:120px; overflow:auto; }
</style>
</head>
<body>
<main>
  <h1>VisionAId — sensor</h1>
  <div id="status">Ready. Attach the phone to your chest, screen facing you, connect the headset, then tap Start.</div>
  <button id="start">Start</button>
  <div id="voiceBox" hidden>
    <button id="talk" disabled aria-label="Talk: say the object you are looking for">🎤 Talk / Parler</button>
    <div id="heard" aria-live="polite"></div>
    <div class="typed">
      <input id="typed" type="text" placeholder="or type: je cherche ma gourde" autocomplete="off">
      <button id="sendTyped" class="secondary">Send</button>
    </div>
  </div>
  <div class="grid">
    <div><b id="fps">–</b><span>frames/s received by the computer</span></div>
    <div><b id="imu">–</b><span>IMU (Hz) received</span></div>
    <div><b id="rtt">–</b><span>round trip (ms)</span></div>
    <div><b id="age">–</b><span>frame age (ms)</span></div>
  </div>
  <div class="sound">
    <div><b>Sound</b> <span id="sound">Put on the headset, then tap Start.</span></div>
    <label for="volume">Volume <output id="volumeOut"></output></label>
    <input type="range" id="volume" min="-24" max="12" step="1" value="0">
    <button id="testSound" class="secondary" disabled>Test the sound (left, right, front)</button>
  </div>
  <div id="level"><div id="bubble"></div></div>
  <div id="levelText">Level: phone upright expected (bubble in the centre).</div>
  <video id="video" playsinline muted autoplay></video>
  <label><input type="checkbox" id="calibMode"> Calibration mode (checkerboard)</label>
  <div class="row">
    <button id="capture" class="secondary" disabled>Capture a view</button>
    <button id="stop" class="secondary" disabled>Stop</button>
  </div>
  <textarea id="notes" rows="2" placeholder="Notes for the session (heating, dropouts, discomfort of the holder…)"></textarea>
  <button id="sendNotes" class="secondary" disabled>Send notes</button>
  <div id="log"></div>
</main>
<script src="/static/audio.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
