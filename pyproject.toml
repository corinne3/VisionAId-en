[project]
name = "visionaid"
version = "0.1.0"
description = "Binaural sound guidance towards an object detected in real time, for visually impaired people"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<2.3",
    "opencv-python>=4.10",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "ultralytics>=8.3",
    "open3d>=0.18,<0.20",
    "pyzmq>=26",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "rerun-sdk>=0.18",
    "soundfile>=0.12",
    "scipy>=1.13",
    "pyyaml>=6",
    "pillow>=10",
    "numba>=0.61",
    "aiohttp>=3.14.5",
    "cryptography>=50.0.2",
    "qrcode>=8.2",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visionaid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 120
markers = [
    "unit: fast synthetic tests",
    "data: need the video or the reference photos",
    "slow: load a real model",
    "integration: pipeline complet",
]
addopts = "-ra -p no:dash"
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning", "ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B023", "B008"]
