# Target card: grey and orange water bottle (phase 1 reference, calibrated in phase 3)
name: gourde
label: ma gourde
spoken: la gourde          # name spoken in the announcements
plural: false
phrases:
  - où est ma gourde
  - ma gourde
  - gourde
  - bouteille d'eau
  - trouve ma gourde
# overrides of config/default.yaml applied when this target is chosen
overrides:
  target:
    name: gourde
    height_m: 0.25
  detector:
    text_prompts: ["water bottle", "bottle", "flask"]
    negative_prompts: ["cup", "bottle", "chair", "bag", "box"]
  paths:
    ref_glob: "gourde_*.jpg"
  reid:
    color_model: orange_gray
    w_embed: 0.6
    w_color: 0.4
    threshold_file: config/reid_threshold.yaml
