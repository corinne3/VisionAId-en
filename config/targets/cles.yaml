# Target card: bunch of keys (small, metallic, variable shape: difficult object)
name: cles
label: mes clés
spoken: les clés          # name spoken in the announcements
plural: true
phrases:
  - où sont mes clés
  - mes clés
  - clés
  - clefs
  - mes clefs
  - trousseau
  - trouve mes clés
overrides:
  target:
    name: cles
    height_m: null          # no scale check from the size of the object
  detector:
    text_prompts: ["keys", "bunch of keys", "key ring", "keychain"]
    negative_prompts: ["phone", "remote control", "wallet", "pen", "coin", "bag", "cup"]
    conf: 0.08              # small object: lowered detection threshold, ReID filters afterwards
  paths:
    ref_glob: "cles_*.jpg"
  reid:
    color_model: none       # no reliable distinctive colour (metal, reflections)
    w_embed: 1.0
    w_color: 0.0
    threshold_file: config/reid_threshold_cles.yaml
    textonly_conf: 0.25     # without a reference photo: minimum detection confidence
